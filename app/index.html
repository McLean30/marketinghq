<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050912">
  <title>Nexai Marketing HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Motion setting before first paint: your choice (saved in this browser) or else the system's reduced-motion setting.
    (function () { var m = null; try { m = localStorage.getItem('nexai-hq:motion'); } catch (e) {}
      if (m !== 'on' && m !== 'off') m = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on';
      document.documentElement.dataset.motion = m; })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Nexai Marketing HQ home">
      <svg viewBox="0 0 40 48" width="26" height="31" aria-hidden="true"><path d="M0 8 L20 0 L40 8 L40 40 L20 48 L0 40 Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M11 34 V14 L29 34 V14" fill="none" stroke="#E8F1FF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span><strong>Nexai</strong> Marketing HQ</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="hq">HQ</a>
      <a href="#/calendar" data-nav="calendar">Calendar</a>
    </nav>
    <button type="button" class="motion-btn" id="motion-toggle" aria-pressed="true" title="Turn agent animation on or off">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12c2.5-5 5.5-5 8 0s5.5 5 8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="motion-label">Motion on</span>
    </button>
    <a class="ws-pill" id="ws-pill" href="#/workspace" title="Workspace and sign-in. Nothing is published from this app.">Loading…</a>
  </header>
  <main id="main" tabindex="-1"></main>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
