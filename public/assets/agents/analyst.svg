<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 446 695" width="446" height="695">
<!-- Interim artwork for the Marketing Analyst (Vantage), drawn locally in the gunmetal style of the HQ team.
     A side-profile robot with a horizontal visor and a dorsal fin studies a chart projected from its wrist.
     Replace with a rendered character: keep the chart panel corners near (218,118) (432,96) (432,318) (218,300). -->
<defs>
  <radialGradient id="bg" cx="62%" cy="30%" r="85%"><stop offset="0" stop-color="#123049"/><stop offset=".45" stop-color="#081626"/><stop offset="1" stop-color="#02060d"/></radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e9f0"/><stop offset=".2" stop-color="#8f9bab"/><stop offset=".48" stop-color="#3a4451"/><stop offset=".72" stop-color="#a5b0be"/><stop offset="1" stop-color="#20272f"/></linearGradient>
  <linearGradient id="steelV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6dee8"/><stop offset=".45" stop-color="#6a7685"/><stop offset="1" stop-color="#252c35"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5564"/><stop offset=".5" stop-color="#1c232c"/><stop offset="1" stop-color="#0b1016"/></linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7c2cf"/><stop offset=".3" stop-color="#6b7786"/><stop offset=".75" stop-color="#2a323c"/><stop offset="1" stop-color="#141920"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2ee6ff" stop-opacity=".55"/><stop offset="1" stop-color="#2ee6ff" stop-opacity="0"/></linearGradient>
  <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ee6ff" stop-opacity=".2"/><stop offset="1" stop-color="#2f6bff" stop-opacity=".1"/></linearGradient>
  <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b6f86"/><stop offset=".6" stop-color="#2ee6ff"/><stop offset="1" stop-color="#bff8ff"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="446" height="695" fill="url(#bg)"/>
<g opacity=".35" fill="#2ee6ff" filter="url(#soft)"><circle cx="360" cy="90" r="40"/><circle cx="90" cy="70" r="26"/><circle cx="410" cy="420" r="30"/></g>
<line x1="20" y1="40" x2="20" y2="330" stroke="#2ee6ff" stroke-opacity=".18" stroke-width="3"/>

<!-- Projection beam from the wrist emitter to the chart -->
<polygon points="300,402 218,118 218,300" fill="url(#beam)" opacity=".55"/>
<polygon points="300,402 432,96 432,318" fill="url(#beam)" opacity=".35"/>

<!-- Holographic chart panel -->
<g class="chart">
  <polygon points="218,118 432,96 432,318 218,300" fill="url(#holo)" stroke="#2ee6ff" stroke-opacity=".85" stroke-width="2"/>
  <g stroke="#2ee6ff" stroke-opacity=".25" stroke-width="1">
    <line x1="218" y1="164" x2="432" y2="148"/><line x1="218" y1="210" x2="432" y2="198"/><line x1="218" y1="256" x2="432" y2="248"/>
  </g>
  <!-- bars -->
  <g fill="#2ee6ff" fill-opacity=".55" stroke="#bff8ff" stroke-opacity=".7" stroke-width="1">
    <polygon points="236,298 258,299 258,246 236,244"/>
    <polygon points="270,299 292,301 292,214 270,211"/>
    <polygon points="304,301 326,303 326,232 304,230"/>
    <polygon points="338,303 360,305 360,178 338,175"/>
    <polygon points="372,305 394,307 394,196 372,193"/>
    <polygon points="406,307 424,309 424,150 406,147"/>
  </g>
  <!-- trend line with points -->
  <polyline points="232,232 266,196 300,214 334,160 368,176 404,128 428,116" fill="none" stroke="#ffc15e" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="#ffe2a8"><circle cx="266" cy="196" r="4"/><circle cx="334" cy="160" r="4"/><circle cx="404" cy="128" r="4"/></g>
  <text x="228" y="140" fill="#bff8ff" font-family="Arial, sans-serif" font-size="13" font-weight="700" opacity=".9">CTR 2.0%</text>
  <text x="352" y="128" fill="#bff8ff" font-family="Arial, sans-serif" font-size="11" opacity=".75">7-DAY</text>
</g>

<!-- Back shoulder and torso -->
<path d="M0 470 C10 410 60 372 130 366 L230 372 C262 380 282 410 286 450 L300 695 L0 695 Z" fill="url(#plate)"/>
<path d="M30 520 L250 520 L262 695 L18 695 Z" fill="url(#dark)" opacity=".85"/>
<path d="M120 540 L200 540 L206 610 L114 610 Z" fill="#0e141b" stroke="#3d4856"/>
<rect x="134" y="566" width="54" height="5" rx="2.5" fill="#2ee6ff" filter="url(#glow)"/>
<g fill="#8b97a6"><circle cx="40" cy="540" r="2.5"/><circle cx="236" cy="540" r="2.5"/><circle cx="46" cy="640" r="2.5"/><circle cx="244" cy="640" r="2.5"/></g>
<rect x="44" y="490" width="34" height="5" rx="2.5" fill="#2ee6ff" filter="url(#glow)"/>

<!-- Pauldron -->
<path d="M150 360 C200 334 268 344 296 392 C306 412 300 440 286 452 C258 420 214 404 160 404 Z" fill="url(#steel)" stroke="#1a2028" stroke-width="2"/>
<path d="M170 372 C210 360 256 368 280 398" fill="none" stroke="#e9f0f7" stroke-opacity=".6" stroke-width="2"/>

<!-- Raised arm: upper arm, elbow, forearm, emitter and pointing hand -->
<path d="M248 420 L300 470 L330 448 L282 396 Z" fill="url(#steelV)" stroke="#1a2028" stroke-width="2"/>
<circle cx="312" cy="462" r="22" fill="url(#dark)" stroke="#9aa6b5" stroke-width="3"/>
<circle cx="312" cy="462" r="7" fill="#2ee6ff" filter="url(#glow)"/>
<path d="M300 456 L326 470 L346 392 L320 380 Z" fill="url(#steel)" stroke="#1a2028" stroke-width="2"/>
<rect x="290" y="392" width="34" height="18" rx="5" transform="rotate(-70 307 401)" fill="#0d151d" stroke="#2ee6ff" stroke-width="2"/>
<circle cx="300" cy="402" r="6" fill="#bff8ff" filter="url(#glow)"/>
<path d="M322 382 L346 388 L352 352 L330 346 Z" fill="url(#plate)" stroke="#1a2028" stroke-width="2"/>
<path d="M336 350 L346 306 L356 308 L350 352 Z" fill="url(#steelV)" stroke="#1a2028" stroke-width="1.5"/>
<path d="M326 348 L330 326 L338 328 L336 350 Z" fill="url(#steelV)" stroke="#1a2028" stroke-width="1.5"/>
<path d="M350 356 L366 340 L372 346 L356 362 Z" fill="url(#steelV)" stroke="#1a2028" stroke-width="1.5"/>
<circle cx="351" cy="305" r="3.5" fill="#2ee6ff" filter="url(#glow)"/>

<!-- Neck -->
<rect x="96" y="318" width="54" height="54" rx="8" fill="url(#dark)" stroke="#3d4856"/>
<g stroke="#8b97a6" stroke-width="2"><line x1="104" y1="332" x2="142" y2="332"/><line x1="104" y1="344" x2="142" y2="344"/><line x1="104" y1="356" x2="142" y2="356"/></g>

<!-- Head in profile, facing the chart: helmet, dorsal fin, visor slit, audio pod -->
<path d="M70 168 L104 104 L120 102 L118 176 Z" fill="url(#steel)" stroke="#1a2028" stroke-width="2"/>
<path d="M104 108 L114 106 L113 170" fill="none" stroke="#2ee6ff" stroke-opacity=".7" stroke-width="2"/>
<path d="M44 236 C42 180 84 150 136 150 C182 150 214 178 218 222 L222 262 C222 296 196 322 158 326 L84 328 C58 328 44 306 44 280 Z" fill="url(#steel)" stroke="#1a2028" stroke-width="3"/>
<path d="M70 180 C96 162 150 158 190 178" fill="none" stroke="#f1f6fb" stroke-opacity=".55" stroke-width="3"/>
<path d="M120 214 L222 206 L224 244 L122 250 C110 250 104 242 104 232 C104 222 110 214 120 214 Z" fill="#071019" stroke="#2b3540" stroke-width="2"/>
<path d="M130 224 L216 218 L217 236 L132 240 Z" fill="url(#visor)" filter="url(#glow)"/>
<path d="M150 228 L210 224" stroke="#ffffff" stroke-opacity=".8" stroke-width="2"/>
<path d="M60 248 C60 230 72 220 88 220 C104 220 114 232 114 248 C114 266 104 278 88 278 C72 278 60 266 60 248 Z" fill="url(#dark)" stroke="#9aa6b5" stroke-width="3"/>
<circle cx="87" cy="249" r="10" fill="#0b1a24" stroke="#2ee6ff" stroke-width="2"/>
<circle cx="87" cy="249" r="4" fill="#2ee6ff" filter="url(#glow)"/>
<path d="M150 290 L210 284" stroke="#2b3540" stroke-width="3"/>
<g fill="#8b97a6"><circle cx="64" cy="200" r="2.5"/><circle cx="196" cy="300" r="2.5"/><circle cx="70" cy="300" r="2.5"/></g>
</svg>
