<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 446 695" width="446" height="695">
<!-- Interim artwork for the Video Creator (Cue), drawn locally in the gunmetal style of the HQ team.
     A robot with a cinema camera rig mounted over its right shoulder (lens barrel, matte box, REC lamp, monitor arm).
     Replace with a rendered character: keep the REC lamp near (335,168) and the lens centre near (402,236). -->
<defs>
  <radialGradient id="bg" cx="40%" cy="30%" r="85%"><stop offset="0" stop-color="#14304a"/><stop offset=".45" stop-color="#081626"/><stop offset="1" stop-color="#02060d"/></radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e9f0"/><stop offset=".2" stop-color="#8f9bab"/><stop offset=".48" stop-color="#3a4451"/><stop offset=".72" stop-color="#a5b0be"/><stop offset="1" stop-color="#20272f"/></linearGradient>
  <linearGradient id="steelV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6dee8"/><stop offset=".45" stop-color="#6a7685"/><stop offset="1" stop-color="#252c35"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5564"/><stop offset=".5" stop-color="#1c232c"/><stop offset="1" stop-color="#0b1016"/></linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7c2cf"/><stop offset=".3" stop-color="#6b7786"/><stop offset=".75" stop-color="#2a323c"/><stop offset="1" stop-color="#141920"/></linearGradient>
  <radialGradient id="glass" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#3fa9c4"/><stop offset=".35" stop-color="#0d3346"/><stop offset=".85" stop-color="#03101a"/><stop offset="1" stop-color="#000"/></radialGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ee6ff" stop-opacity=".5"/><stop offset="1" stop-color="#2f6bff" stop-opacity=".25"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="446" height="695" fill="url(#bg)"/>
<g opacity=".35" fill="#2ee6ff" filter="url(#soft)"><circle cx="80" cy="90" r="34"/><circle cx="390" cy="420" r="30"/><circle cx="300" cy="60" r="22"/></g>
<line x1="426" y1="330" x2="426" y2="620" stroke="#2ee6ff" stroke-opacity=".18" stroke-width="3"/>

<!-- Torso and shoulders -->
<path d="M30 470 C40 400 90 368 160 362 L290 362 C350 368 390 400 404 470 L420 695 L14 695 Z" fill="url(#plate)"/>
<path d="M70 520 L370 520 L382 695 L56 695 Z" fill="url(#dark)" opacity=".85"/>
<path d="M180 540 L262 540 L268 612 L174 612 Z" fill="#0e141b" stroke="#3d4856"/>
<rect x="194" y="566" width="56" height="5" rx="2.5" fill="#2ee6ff" filter="url(#glow)"/>
<g fill="#8b97a6"><circle cx="82" cy="540" r="2.5"/><circle cx="360" cy="540" r="2.5"/><circle cx="76" cy="650" r="2.5"/><circle cx="366" cy="650" r="2.5"/></g>
<rect x="92" y="492" width="34" height="5" rx="2.5" fill="#2ee6ff" filter="url(#glow)"/>

<!-- Left pauldron -->
<path d="M40 430 C46 384 96 356 150 366 L168 420 C120 418 78 436 54 470 Z" fill="url(#steel)" stroke="#1a2028" stroke-width="2"/>

<!-- Neck and head (compact, single cyan eye slit) -->
<g transform="translate(-52 6)">
<rect x="178" y="300" width="70" height="66" rx="10" fill="url(#dark)" stroke="#3d4856"/>
<g stroke="#8b97a6" stroke-width="2"><line x1="188" y1="318" x2="238" y2="318"/><line x1="188" y1="332" x2="238" y2="332"/><line x1="188" y1="346" x2="238" y2="346"/></g>
<path d="M140 210 C140 160 176 128 214 128 C256 128 290 160 290 210 L290 270 C290 300 266 318 236 318 L192 318 C162 318 140 300 140 270 Z" fill="url(#steel)" stroke="#1a2028" stroke-width="3"/>
<path d="M156 170 C176 146 214 138 250 146" fill="none" stroke="#f1f6fb" stroke-opacity=".55" stroke-width="3"/>
<rect x="158" y="214" width="114" height="30" rx="15" fill="#071019" stroke="#2b3540" stroke-width="2"/>
<rect x="168" y="222" width="94" height="14" rx="7" fill="#2ee6ff" filter="url(#glow)"/>
<rect x="190" y="226" width="40" height="4" rx="2" fill="#ffffff" opacity=".8"/>
<rect x="176" y="276" width="78" height="8" rx="4" fill="#1a222b"/>

</g>
<!-- Shoulder mount and rig arm over the right shoulder -->
<path d="M270 372 C304 344 352 346 382 376 L392 420 C356 404 316 402 284 414 Z" fill="url(#steel)" stroke="#1a2028" stroke-width="2"/>
<rect x="316" y="300" width="22" height="78" rx="6" fill="url(#dark)" stroke="#9aa6b5" stroke-width="2"/>
<rect x="298" y="292" width="58" height="16" rx="5" fill="url(#steelV)" stroke="#1a2028" stroke-width="2"/>

<!-- Cinema camera body -->
<path d="M250 160 L380 160 C392 160 400 168 400 180 L400 292 L250 292 C238 292 230 284 230 272 L230 180 C230 168 238 160 250 160 Z" fill="url(#dark)" stroke="#9aa6b5" stroke-width="3"/>
<rect x="244" y="176" width="70" height="44" rx="6" fill="#0b141c" stroke="#3d4856"/>
<g fill="#8b97a6"><circle cx="248" cy="276" r="3"/><circle cx="386" cy="276" r="3"/><circle cx="386" cy="174" r="3"/></g>
<rect x="250" y="236" width="56" height="8" rx="4" fill="#2a323c"/><rect x="250" y="252" width="40" height="8" rx="4" fill="#2a323c"/>
<!-- top handle -->
<path d="M262 160 L262 136 L362 136 L362 160" fill="none" stroke="url(#steelV)" stroke-width="12" stroke-linejoin="round"/>
<!-- REC lamp -->
<circle cx="335" cy="168" r="0" fill="none"/>
<rect x="320" y="176" width="56" height="22" rx="5" fill="#140c0c" stroke="#3d4856"/>
<circle class="rec-dot" cx="333" cy="187" r="6" fill="#ff3b3b" filter="url(#glow)"/>
<text x="344" y="192" fill="#ffb3b3" font-family="Arial, sans-serif" font-size="12" font-weight="700">REC</text>

<!-- Lens barrel and matte box pointing forward -->
<rect x="398" y="196" width="26" height="80" rx="4" fill="url(#steelV)" stroke="#1a2028" stroke-width="2"/>
<g stroke="#20272f" stroke-width="2"><line x1="404" y1="196" x2="404" y2="276"/><line x1="412" y1="196" x2="412" y2="276"/><line x1="418" y1="196" x2="418" y2="276"/></g>
<path d="M424 182 L446 168 L446 304 L424 290 Z" fill="url(#dark)" stroke="#9aa6b5" stroke-width="2"/>
<circle cx="402" cy="236" r="0"/>
<ellipse cx="438" cy="236" rx="8" ry="44" fill="url(#glass)" stroke="#2ee6ff" stroke-opacity=".6" stroke-width="2"/>

<!-- Monitor on an arm, angled towards the face -->
<path d="M252 196 L210 150" stroke="url(#steelV)" stroke-width="8" stroke-linecap="round"/>
<g transform="rotate(-12 168 122)">
  <rect x="112" y="88" width="112" height="70" rx="8" fill="#0b141c" stroke="#9aa6b5" stroke-width="3"/>
  <rect x="120" y="96" width="96" height="54" rx="4" fill="url(#screen)"/>
  <rect class="scrub" x="120" y="144" width="40" height="6" fill="#2ee6ff"/>
  <path d="M130 136 L150 118 L166 128 L186 108 L206 122" fill="none" stroke="#bff8ff" stroke-width="2"/>
</g>
</svg>
