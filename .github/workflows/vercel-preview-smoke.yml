# Vercel preview smoke test
#
# Runs against the Vercel Preview deployment of one exact commit and reports a check named
# "Vercel preview smoke test" on that commit (it shows on any pull request containing it).
#
# - Runs on every push: it waits (up to 20 minutes) for Vercel to finish deploying that exact commit and tests
#   that deployment. Vercel reports it either as a GitHub Deployment (with its URL) or as a "Vercel" commit status
#   (deployment id only). For the latter the URL comes from the Vercel API when a read-only VERCEL_TOKEN secret is
#   set, otherwise from the branch URL, accepted only once the deployment reports this exact commit at
#   /api/version. A new commit gets a fresh result; an older deployment can't stand in for it.
# - Manual run (Actions → Vercel preview smoke test → Run workflow) takes a commit SHA and does the same.
#   (GitHub only offers manual runs for workflows on the default branch.)
# - Results: pass → success; fail → failure; blocked (preview protection / no access) → action_required,
#   which GitHub never treats as passing. Preview protection stays on: add the Vercel "Protection Bypass for
#   Automation" secret as the repository secret VERCEL_AUTOMATION_BYPASS_SECRET.
# - Demo mode only: no paid AI calls (the test refuses them), nothing created or published.
name: Vercel preview smoke test

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to test (its own Vercel deployment is found and waited for)
        required: true
      branch:
        description: Branch the commit was deployed from (used for the branch URL when no VERCEL_TOKEN is set)
        required: false
      preview_url:
        description: The deployment's own unique URL, if discovery is blocked (accepted only if it reports this exact commit at /api/version)
        required: false

permissions:
  contents: read
  checks: write
  deployments: read
  statuses: read

concurrency:
  group: vercel-smoke-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke (runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the commit's Vercel deployment and wait for it
        id: dep
        uses: actions/github-script@v7
        env:
          INPUT_SHA: ${{ inputs.sha || github.sha }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          GIVEN_URL: ${{ inputs.preview_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            let sha = (process.env.INPUT_SHA || '').trim();
            if (!/^[0-9a-f]{7,40}$/.test(sha)) throw new Error('Give a commit SHA.');
            sha = (await github.rest.repos.getCommit({ owner, repo, ref: sha })).data.sha;
            let state = 'missing', url = '', depId = '', env = '', source = '', note = '', verify = false;
            const given = (process.env.GIVEN_URL || '').trim().replace(/\/+$/, '');
            if (given) {
              // A URL you passed in: used only once the deployment itself reports this exact commit.
              if (!/^https:\/\/[a-z0-9.-]+\.vercel\.app$/i.test(given)) throw new Error('preview_url must be a https://….vercel.app deployment URL.');
              url = given; state = 'success'; source = 'URL passed to the run, checked against /api/version'; env = 'preview'; verify = true;
            }
            // Vercel reports each commit's deployment either as a GitHub Deployment or as a "Vercel" commit status.
            const deadline = Date.now() + 20 * 60 * 1000;
            while (!given) {
              const deps = (await github.rest.repos.listDeployments({ owner, repo, sha, per_page: 30 })).data
                .filter((d) => /preview|production/i.test(d.environment)).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              if (deps.length) {
                const d = deps[0];
                const st = (await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: d.id, per_page: 1 })).data[0];
                if (st && ['success', 'failure', 'error', 'inactive'].includes(st.state)) {
                  state = st.state; url = st.environment_url || st.target_url || ''; depId = String(d.id); env = d.environment; source = 'GitHub deployment';
                  break;
                }
              }
              const vs = (await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha })).data.statuses.find((x) => /^vercel$/i.test(x.context));
              if (vs && vs.state !== 'pending') {
                state = vs.state; source = 'Vercel commit status';
                const m = /vercel\.com\/([^/]+)\/([^/]+)\/([A-Za-z0-9]+)/.exec(vs.target_url || '');
                if (state === 'success' && m) {
                  const [, team, project, id] = m;
                  depId = id;
                  if (process.env.VERCEL_TOKEN) {
                    const r = await fetch(`https://api.vercel.com/v13/deployments/dpl_${id}?slug=${team}`, { headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
                    const j = await r.json().catch(() => ({}));
                    if (r.ok && j.url) {
                      if (j.meta?.githubCommitSha && j.meta.githubCommitSha !== sha) { state = 'failure'; note = `Vercel says deployment ${id} is for ${j.meta.githubCommitSha}, not ${sha}.`; }
                      url = `https://${j.url}`; env = j.target || 'preview'; source = 'Vercel API (exact deployment)';
                    } else note = `The Vercel API didn't return deployment ${id} (HTTP ${r.status}).`;
                  }
                  if (!url) {
                    // No token: use the branch URL, and only accept it if the deployment itself reports this exact commit.
                    const slug = (process.env.BRANCH || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                    const host = `${project}-git-${slug}-${team}`;
                    if (slug && host.length <= 63) { url = `https://${host}.vercel.app`; env = 'preview'; source = 'branch URL, checked against /api/version'; verify = true; }
                    else { state = 'missing'; note = `Vercel deployed this commit (deployment ${id}) but didn't publish its URL to GitHub, and the branch URL can't be derived (${host.length} characters, over Vercel's 63-character limit). Add a read-only VERCEL_TOKEN repository secret so the check can look the URL up.`; }
                  }
                }
                break;
              }
              if (Date.now() > deadline) { note = 'Vercel recorded no finished deployment for this commit on GitHub within 20 minutes.'; break; }
              core.info(`Waiting for Vercel to finish deploying ${sha.slice(0, 7)}…`);
              await sleep(20000);
            }
            if (verify && state === 'success') {
              // The branch URL follows the branch's newest deployment; wait until it serves this commit.
              let served = null, seen = 'no response';
              for (let i = 0; i < 12; i++) {
                const r = await fetch(`${url}/api/version`, { headers: process.env.BYPASS ? { 'x-vercel-protection-bypass': process.env.BYPASS } : {} }).catch(() => null);
                const body = r && r.ok ? await r.json().catch(() => null) : null;
                served = body ? body.commit : null;
                seen = !r ? 'no response' : r.status === 401 || r.status === 403 ? `HTTP ${r.status}: preview protection answered${process.env.BYPASS ? ' and rejected the bypass secret' : ' (the VERCEL_AUTOMATION_BYPASS_SECRET repository secret isn’t set)'}`
                  : r.status === 404 ? 'HTTP 404: no deployment at that branch URL, or this build has no /api/version'
                  : !body && (/vercel\.com/.test(new URL(r.url).hostname) || r.redirected) ? `redirected to ${new URL(r.url).hostname}: preview protection sent the request to Vercel’s sign-in page${process.env.BYPASS ? ', so the bypass secret wasn’t accepted' : ' (the VERCEL_AUTOMATION_BYPASS_SECRET repository secret isn’t set)'}`
                  : !body ? `HTTP ${r.status} without the expected JSON (${(r.headers.get('content-type') || 'no content type').split(';')[0]})` : body.commit ? `it serves commit ${body.commit.slice(0, 7)}` : 'HTTP 200 but no commit: Vercel isn’t exposing VERCEL_GIT_COMMIT_SHA (Project → Settings → Environment Variables → “Automatically expose System Environment Variables”)';
                core.info(`/api/version: ${seen}`);
                if (served === sha) break;
                await sleep(15000);
              }
              if (served !== sha) { state = 'missing'; note = `${url} couldn’t be confirmed as this commit’s deployment (${seen}), so it wasn’t tested. Fix that, or add a read-only VERCEL_TOKEN repository secret for an exact lookup.`; url = ''; }
            }
            core.info(`Deployment: ${state} via ${source || 'nothing'} ${url} ${note}`);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const check = await github.rest.checks.create({
              owner, repo, head_sha: sha, name: 'Vercel preview smoke test', status: 'in_progress', details_url: runUrl,
              output: { title: 'Testing the Vercel preview', summary: `Commit ${sha}\nPreview: ${url || 'not available'}` },
            });
            core.setOutput('sha', sha);
            core.setOutput('state', state);
            core.setOutput('url', url);
            core.setOutput('deployment_id', depId);
            core.setOutput('environment', env);
            core.setOutput('source', source);
            core.setOutput('note', note);
            core.setOutput('check_id', String(check.data.id));
            core.setOutput('run_url', runUrl);

      - name: Decide what to check for this commit
        id: expect
        env:
          SHA: ${{ steps.dep.outputs.sha }}
        run: |
          if git cat-file -e "${SHA}:public/js/review.js" 2>/dev/null; then echo "reviewer=1" >> "$GITHUB_OUTPUT"; else echo "reviewer=0" >> "$GITHUB_OUTPUT"; fi
          if git cat-file -e "${SHA}:public/js/publishing.js" 2>/dev/null; then echo "publishing=1" >> "$GITHUB_OUTPUT"; else echo "publishing=0" >> "$GITHUB_OUTPUT"; fi
          if git cat-file -e "${SHA}:public/js/analytics.js" 2>/dev/null; then echo "analyst=1" >> "$GITHUB_OUTPUT"; else echo "analyst=0" >> "$GITHUB_OUTPUT"; fi
          if git cat-file -e "${SHA}:public/js/video.js" 2>/dev/null; then echo "video=1" >> "$GITHUB_OUTPUT"; else echo "video=0" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.dep.outputs.state == 'success'
        with:
          node-version: 22

      - name: Install the browser
        if: steps.dep.outputs.state == 'success'
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run the smoke test against the preview
        if: steps.dep.outputs.state == 'success'
        env:
          PREVIEW_URL: ${{ steps.dep.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          EXPECT_REVIEWER: ${{ steps.expect.outputs.reviewer }}
          EXPECT_PUBLISHING: ${{ steps.expect.outputs.publishing }}
          EXPECT_ANALYST: ${{ steps.expect.outputs.analyst }}
          EXPECT_VIDEO: ${{ steps.expect.outputs.video }}
          REQUIRE_SHA_MATCH: ${{ inputs.preview_url && '1' || '0' }}
          EXPECT_SHA: ${{ steps.dep.outputs.sha }}
          SMOKE_RESULT: smoke-result.json
          SMOKE_SHOTS: smoke-shots
        run: |
          mkdir -p smoke-shots
          node tests/vercel-smoke.mjs || true

      - name: Keep screenshots
        if: always() && steps.dep.outputs.state == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-smoke-${{ steps.dep.outputs.sha }}
          path: smoke-shots/
          if-no-files-found: ignore

      - name: Report "Vercel preview smoke test"
        if: always() && steps.dep.outputs.check_id != ''
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ steps.dep.outputs.check_id }}
          SHA: ${{ steps.dep.outputs.sha }}
          STATE: ${{ steps.dep.outputs.state }}
          URL: ${{ steps.dep.outputs.url }}
          DEP_ID: ${{ steps.dep.outputs.deployment_id }}
          ENVIRONMENT: ${{ steps.dep.outputs.environment }}
          RUN_URL: ${{ steps.dep.outputs.run_url }}
          SOURCE: ${{ steps.dep.outputs.source }}
          NOTE: ${{ steps.dep.outputs.note }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const e = process.env;
            let result;
            if (e.STATE !== 'success') {
              result = e.STATE === 'missing'
                ? { status: 'blocked', summary: `The preview for this commit could not be tested. ${e.NOTE || 'No deployment was found.'}`, steps: [] }
                : { status: 'fail', summary: `The Vercel deployment finished with “${e.STATE}”. ${e.NOTE}`, steps: [] };
            } else {
              try { result = JSON.parse(fs.readFileSync('smoke-result.json', 'utf8')); }
              catch { result = { status: 'fail', summary: 'The smoke test did not produce a result.', steps: [] }; }
            }
            const conclusion = { pass: 'success', fail: 'failure', blocked: 'action_required' }[result.status] || 'failure';
            const title = { pass: 'Passed', fail: 'Failed', blocked: 'Blocked: could not reach HQ' }[result.status] || 'Failed';
            const lines = (result.steps || []).map((s) => `- ${s.ok ? '✅' : '❌'} ${s.text}`).join('\n');
            // A check created moments ago can briefly 404 on update; retry, then fall back to a new completed check so a
            // result is always recorded (never left "in progress").
            const finishCheck = async (params) => {
              for (let i = 0; i < 6; i++) {
                try { return await github.rest.checks.update({ owner, repo, check_run_id: Number(e.CHECK_ID), ...params }); }
                catch (err) { if (err.status !== 404) throw err; await new Promise((r) => setTimeout(r, 2000 * (i + 1))); }
              }
              core.warning('The check could not be updated; recording the result as a new completed check.');
              return github.rest.checks.create({ owner, repo, head_sha: e.SHA, name: 'Vercel preview smoke test', ...params });
            };
            await finishCheck({
              status: 'completed', conclusion, details_url: e.RUN_URL,
              output: {
                title: `${title}: ${result.summary}`.slice(0, 250),
                summary: `**${title}.** ${result.summary}\n\n- Commit: \`${e.SHA}\`\n- Preview URL: ${e.URL || 'none'}\n- Deployment: ${e.DEP_ID || 'none'} (${e.ENVIRONMENT || 'n/a'}), found via ${e.SOURCE || 'nothing'}\n- Run: ${e.RUN_URL}`,
                text: lines || 'No browser steps ran.',
              },
            });
            core.summary.addHeading(`Vercel preview smoke test: ${title}`).addRaw(`${result.summary}\n\nCommit ${e.SHA}\n\nPreview ${e.URL}\n\n${lines}`).write();
            if (result.status !== 'pass') core.setFailed(`${title}: ${result.summary}`);
